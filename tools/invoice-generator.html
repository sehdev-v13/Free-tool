<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free Invoice Generator. Create a simple printable invoice online with business, customer, item, amount and GST details."><meta name="robots" content="index,follow"><link rel="canonical" href="https://sehdevverma.github.io/free-tool-hub/tools/invoice-generator.html"><meta name="google-adsense-account" content="ca-pub-5821164202370457"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5821164202370457" crossorigin="anonymous"></script><title>Free Invoice Generator – Create Printable Invoice | FreeToolHub</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header><div class="wrap nav"><a class="logo" href="../index.html">FreeTool<span>Hub</span></a><button class="menu-toggle" aria-label="Open menu" onclick="document.querySelector('.nav nav').classList.toggle('open')">☰</button><nav><a href="../index.html#tools">Tools</a><a href="../about.html">About</a><a href="../privacy.html">Privacy</a></nav></div></header><main class="tool-page"><div class="wrap"><div class="breadcrumb"><a href="../index.html">Home</a> / Invoice Generator</div><div class="tool-wrapper"><div class="tool-box"><h1>Free Invoice Generator</h1><p>Create a simple invoice and print or save it as PDF using your browser.</p><div class="form-row"><div class="form-group"><label>Business Name</label><input id="biz" placeholder="Business name"></div><div class="form-group"><label>Customer Name</label><input id="cust" placeholder="Customer name"></div></div><div class="form-row"><div class="form-group"><label>Item / Service</label><input id="item" placeholder="Service or product"></div><div class="form-group"><label>Amount (₹)</label><input id="amt" type="number" min="0" value="1000"></div></div><div class="form-group"><label>GST (%)</label><input id="gst" type="number" min="0" value="18"></div><button class="btn" onclick="makeInvoice()">Create Invoice</button><div id="out" class="result" hidden></div></div><div class="ad-slot"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5821164202370457" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div></div></div></main><footer><div class="wrap"><p><a href="../index.html">FreeToolHub</a> · <a href="../privacy.html">Privacy</a></p></div></footer><script>function makeInvoice(){let b=document.getElementById('biz').value,c=document.getElementById('cust').value,i=document.getElementById('item').value,a=+document.getElementById('amt').value,g=+document.getElementById('gst').value,t=a+a*g/100,o=document.getElementById('out');o.hidden=false;o.innerHTML='<div id="invoice"><h2>'+ (b||'Invoice') +'</h2><p>Customer: '+(c||'—')+'</p><p>Item: '+(i||'—')+'</p><p>Subtotal: ₹'+a.toFixed(2)+'</p><p>GST ('+g+'%): ₹'+(a*g/100).toFixed(2)+'</p><strong>Total: ₹'+t.toFixed(2)+'</strong></div><br><button class="btn" onclick="print()">Print / Save PDF</button>'}</script></body></html>
