<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free Unit Converter for length, weight and temperature. Convert common units instantly online."><meta name="robots" content="index,follow"><link rel="canonical" href="https://sehdevverma.github.io/free-tool-hub/tools/unit-converter.html"><meta name="google-adsense-account" content="ca-pub-5821164202370457"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5821164202370457" crossorigin="anonymous"></script><title>Unit Converter – Length, Weight & Temperature | FreeToolHub</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header><div class="wrap nav"><a class="logo" href="../index.html">FreeTool<span>Hub</span></a><button class="menu-toggle" aria-label="Open menu" onclick="document.querySelector('.nav nav').classList.toggle('open')">☰</button><nav><a href="../index.html#tools">Tools</a><a href="../about.html">About</a><a href="../privacy.html">Privacy</a></nav></div></header><main class="tool-page"><div class="wrap"><div class="breadcrumb"><a href="../index.html">Home</a> / Unit Converter</div><div class="tool-wrapper"><div class="tool-box"><h1>Unit Converter</h1><p>Convert common length, weight and temperature units.</p><div class="form-group"><label>Category</label><select id="cat" onchange="loadUnits()"><option value="length">Length</option><option value="weight">Weight</option><option value="temperature">Temperature</option></select></div><div class="form-row"><div class="form-group"><label>From</label><select id="from"></select></div><div class="form-group"><label>To</label><select id="to"></select></div></div><div class="form-group"><label>Value</label><input id="val" type="number" step="any" value="1"></div><button class="btn" onclick="convert()">Convert</button><div id="out" class="result" hidden></div></div><div class="ad-slot"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5821164202370457" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div></div></div></main><footer><div class="wrap"><p><a href="../index.html">FreeToolHub</a> · <a href="../privacy.html">Privacy</a></p></div></footer><script>const u={length:{Meter:1,Kilometer:1000,Centimeter:.01,Millimeter:.001,Foot:.3048,Mile:1609.344},weight:{Kilogram:1,Gram:.001,Pound:.45359237,Ounce:.0283495231},temperature:{Celsius:'C',Fahrenheit:'F',Kelvin:'K'}};function loadUnits(){let c=document.getElementById('cat').value,items=Object.keys(u[c]);document.getElementById('from').innerHTML=items.map(x=>'<option>'+x+'</option>').join('');document.getElementById('to').innerHTML=items.map(x=>'<option>'+x+'</option>').join('')}function convert(){let c=document.getElementById('cat').value,v=+document.getElementById('val').value,a=document.getElementById('from').value,b=document.getElementById('to').value,r;if(c==='temperature'){let f=x=>a==='Celsius'?x:a==='Fahrenheit'?(x-32)*5/9:x-273.15,g=y=>b==='Celsius'?y:b==='Fahrenheit'?y*9/5+32:y+273.15;r=g(f(v))}else r=v*u[c][a]/u[c][b];let o=document.getElementById('out');o.hidden=false;o.innerHTML='<strong>'+Number(r).toFixed(6).replace(/0+$/,'').replace(/\.$/,'')+' '+b+'</strong>'}loadUnits()</script></body></html>
