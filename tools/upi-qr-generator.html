"true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div></div></div></main><footer><div class="wrap"><p><a href="../index.html">FreeToolHub</a> · <a href="../privacy.html">Privacy</a></p></div></footer><script>function makeQR(){let u=document.getElementById('upi').value.trim(),n=document.getElementById('name').value.trim(),a=document.getElementById('amt').value.trim();if(!u)return alert('Enter a UPI ID.');let data='upi://pay?pa='+encodeURIComponent(u)+'&pn='+encodeURIComponent(n);if(a)data+='&am='+encodeURIComponent(a)+'&cu=INR';let qr='https://quickchart.io/qr?size=260&text='+encodeURIComponent(data);let o=document.getElementById('out');o.hidden=false;o.innerHTML='<img alt="Generated UPI QR code" src="'+qr+'" style="margin:auto"><br><a class="btn" target="_blank" rel="noopener" href="'+qr+'">Open QR Image</a>'}</script></body></html>
